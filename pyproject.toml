[project]
name = "tradepilot"
version = "0.1.0"
description = "Adaptive AI trading agent for Alpaca paper trading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "google-genai>=2.20.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "fastapi>=0.109.2",
    "uvicorn>=0.27.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
